name: FA reminder
on:
  # Timing comes from cron-job.org (workflow_dispatch), not GitHub's scheduler.
  workflow_dispatch:
permissions:
  contents: write
env:
  NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python fa_needed.py --remind
      - name: Commit changes
        run: |
          git config user.name "trigger-bot"
          git config user.email "trigger-bot@users.noreply.github.com"
          git add FA_NEEDED.md
          git diff --cached --quiet || (git commit -m "bot update" && git push)

      - name: Phone alert if this run failed
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          curl -s -H "Title: trigger-alerts: FA reminder FAILED" -H "Priority: high" -H "Tags: x" \
            -H "Click: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -d "Tap to open the failed run on GitHub." \
            "https://ntfy.sh/${NTFY_TOPIC}" || true
