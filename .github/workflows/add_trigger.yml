name: Add trigger
on:
  workflow_dispatch:
    inputs:
      trigger_yaml:
        description: 'Full YAML of one trigger'
        required: true
        type: string
permissions:
  contents: write
env:
  NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

jobs:
  add:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Write inbox file
        env:
          TRIGGER_YAML: ${{ inputs.trigger_yaml }}
        run: |
          mkdir -p inbox
          printf '%s\n' "$TRIGGER_YAML" > inbox/$(date +%s).yml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python check.py
        env:
          INGEST_ONLY: "true"
      - name: Commit changes
        run: |
          git config user.name "trigger-bot"
          git config user.email "trigger-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "add trigger from workflow" && (git push || (git pull --rebase && git push)))

      - name: Phone alert if this run failed
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          curl -s -H "Title: trigger-alerts: Add trigger FAILED" -H "Priority: high" -H "Tags: x" \
            -H "Click: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -d "Tap to open the failed run on GitHub." \
            "https://ntfy.sh/${NTFY_TOPIC}" || true
