name: Test ping
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python test_ping.py
